<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>작업대 중급 자산 5종</title><style>body{margin:0;background:#f8f5eb;color:#334330;font:16px/1.7 system-ui}main{max-width:1120px;margin:auto;padding:32px 22px}h1{font-size:30px}p{color:#64705e}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}a{display:block;background:#e4e9dc;color:inherit;border-radius:14px;padding:20px;text-decoration:none}img{width:100%;height:260px;object-fit:contain;display:block}.bench{grid-row:span 2}.bench img{height:540px}a:focus-visible{outline:3px solid #536c44}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.bench{grid-column:span 2;grid-row:auto}.bench img{height:350px}img{height:180px}}</style><main><h1>분갈이 작업대 · 중급 5종</h1><p>개별 PNG 제작본입니다. 각 카드를 누르면 원본 파일을 내려받을 수 있습니다.</p><div class="grid"><a class="bench" href="workbench.png" download><img src="workbench.png" alt="빈 원목 작업대">01 · 빈 작업대</a><a href="tools.png" download><img src="tools.png" alt="모종삽과 전정가위 트레이">02 · 도구 트레이</a><a href="pots.png" download><img src="pots.png" alt="빈 화분과 새싹 화분">03 · 화분 묶음</a><a href="seeds.png" download><img src="seeds.png" alt="씨앗 봉투 세 개가 있는 상자">04 · 씨앗 상자</a><a href="soil.png" download><img src="soil.png" alt="흙 주머니">05 · 흙 주머니</a></div><p>작업실에는 아직 연결하지 않았습니다. 빈 작업대의 손잡이·뒤 선반 형상은 승인 시안과 조금 달라졌으며, 연결 전에 가장자리와 소품 원근을 추가로 다듬을 필요가 있습니다.</p></main></html>
