<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>온실 선반 · 중급 자산</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5eb;color:#334330;font:16px/1.7 system-ui}main{max-width:1160px;margin:auto;padding:30px 22px}h1{font-size:30px}p{color:#64705e}.layout{display:grid;grid-template-columns:1fr 1fr;gap:32px}.stage{position:relative;width:100%;aspect-ratio:600/780;background:#e4e9dc;border-radius:18px}.stage img{position:absolute;height:auto}.shelf{width:83.33%;left:8.33%;top:12.82%}.top{width:80%;left:10%;top:1.5%}.middle{width:75%;left:12.5%;top:31.4%}.bottom{width:70%;left:15%;top:49.1%}.assets{display:grid;grid-template-columns:1fr 1fr;gap:16px}.assets a{display:block;padding:15px;background:white;border:1px solid #d9dfce;border-radius:12px;color:inherit;text-decoration:none}.assets img{display:block;width:100%;height:150px;object-fit:contain}.controls{display:flex;flex-wrap:wrap;gap:15px;margin:20px 0}input{accent-color:#526947}a:focus-visible{outline:3px solid #526947}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style><main><h1>온실 선반 · 중급 4종</h1><p>빈 선반과 식물 묶음 3개를 각각 제작했습니다. 체크를 해제하면 묶음별 구성을 확인할 수 있습니다.</p><div class="controls"><label><input type="checkbox" data-id="top" checked> 상단</label><label><input type="checkbox" data-id="middle" checked> 중단</label><label><input type="checkbox" data-id="bottom" checked> 하단</label></div><div class="layout"><div class="stage"><img class="shelf" src="shelf.png" alt="빈 선반"><img id="bottom" class="bottom" src="bottom.png" alt="하단 식물 묶음"><img id="middle" class="middle" src="middle.png" alt="중단 식물 묶음"><img id="top" class="top" src="top.png" alt="상단 식물 묶음"></div><div><div class="assets"><a href="shelf.png" download><img src="shelf.png" alt="">빈 선반 · PNG</a><a href="top.png" download><img src="top.png" alt="">상단 묶음 · PNG</a><a href="middle.png" download><img src="middle.png" alt="">중단 묶음 · PNG</a><a href="bottom.png" download><img src="bottom.png" alt="">하단 묶음 · PNG</a></div><p>조합은 실제 4개 파일을 겹친 배치 예시입니다. 아직 작업실 팔레트에는 등록하지 않았습니다. 파일마다 원본 해상도가 달라 화면 배치 크기를 조정했습니다.</p><p>이 단계는 중급 선반 자산 제작입니다. 고급 개별 화분, 난이도 선택·저장 기능은 후속 구현입니다.</p></div></div></main><script>document.querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{document.getElementById(input.dataset.id).hidden=!input.checked}));</script></html>
